[project]
name = "fine-tuning-recipes"
version = "0.1.0"
description = "Production-ready fine-tuning recipes: LoRA, QLoRA, DPO with config-driven pipelines"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0,<4.50",
    "datasets>=2.18.0,<3.0",
    "peft>=0.9.0",
    "trl>=0.7.10,<0.13",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "wandb>=0.16.0",
    "sentencepiece>=0.1.99",
    "fire>=0.5.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
